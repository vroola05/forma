<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>icons</title>

    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px 20px;
            text-align: center;
        }
        .preview {
            width: 100px;
            display: inline-block;
            margin: 10px;
        }
        .preview .inner {
            display: inline-block;
            width: 100%;
            text-align: center;
            background: #f5f5f5;
            -webkit-border-radius: 3px 3px 0 0;
            -moz-border-radius: 3px 3px 0 0;
            border-radius: 3px 3px 0 0;
        }
        .preview .inner  {
            line-height: 85px;
            font-size: 40px;
            color: #333;
        }
        .label {
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
            padding: 5px;
            font-size: 10px;
            font-family: Monaco, monospace;
            color: #666;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            background: #ddd;
            -webkit-border-radius: 0 0 3px 3px;
            -moz-border-radius: 0 0 3px 3px;
            border-radius: 0 0 3px 3px;
            color: #666;
        }
    </style>

    <link rel="stylesheet" type="text/css" href="icons.css" />
</head>
<body>

    <h1>icons</h1>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-x-lg"></i>
            </span>
            <br>
            <span class='label'>x-lg</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-three-dots-vertical"></i>
            </span>
            <br>
            <span class='label'>three-dots-vertical</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-plus-lg"></i>
            </span>
            <br>
            <span class='label'>plus-lg</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-person-circle"></i>
            </span>
            <br>
            <span class='label'>person-circle</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-lightning-charge"></i>
            </span>
            <br>
            <span class='label'>lightning-charge</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-grip-vertical"></i>
            </span>
            <br>
            <span class='label'>grip-vertical</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-file-plus"></i>
            </span>
            <br>
            <span class='label'>file-plus</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-chevron-up"></i>
            </span>
            <br>
            <span class='label'>chevron-up</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-chevron-right"></i>
            </span>
            <br>
            <span class='label'>chevron-right</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-chevron-left"></i>
            </span>
            <br>
            <span class='label'>chevron-left</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-chevron-down"></i>
            </span>
            <br>
            <span class='label'>chevron-down</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-caret-right-fill"></i>
            </span>
            <br>
            <span class='label'>caret-right-fill</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-arrows-angle-expand"></i>
            </span>
            <br>
            <span class='label'>arrows-angle-expand</span>
        </div>


        <div class="preview">
            <span class="inner">
                <i class="icon icon-arrows-angle-contract"></i>
            </span>
            <br>
            <span class='label'>arrows-angle-contract</span>
        </div>


</body>
</html>
